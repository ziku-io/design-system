name: Release

# Fires on the tag, not the push, so a release cut from a laptop and one cut
# from the UI behave identically.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # No `version` here on purpose: package.json's `packageManager` is the
      # single source, so CI and laptops all run the same pnpm.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # A tag is a promise: apps pin it forever. Verify the promise before
      # publishing the release, not after someone reports a broken install.
      - name: Tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          [ "$tag" = "$pkg" ] || {
            echo "::error::Tag v$tag does not match package.json version $pkg"
            exit 1
          }

      - run: pnpm typecheck
      - run: pnpm test

      - name: dist/ matches the source at this tag
        run: |
          pnpm build
          git diff --exit-code -- dist || {
            echo "::error::dist/ at this tag is stale — consumers would install files that do not match the source"
            exit 1
          }

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --notes-start-tag "$(git tag --list 'v*' --sort=-v:refname | sed -n 2p)"
