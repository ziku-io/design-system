name: Storybook

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only what Pages needs: read the code, publish the site.
permissions:
  contents: read
  pages: write
  id-token: write

# A newer push supersedes an in-flight deploy rather than racing it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version` here on purpose: package.json's `packageManager` is the
      # single source, so CI and laptops all run the same pnpm.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The gate: a broken component must not reach the published docs.
      - run: pnpm typecheck
      - run: pnpm test

      # dist/ is committed so consumers install without building. If it is
      # stale, the package they get does not match this source.
      - run: pnpm build
      - name: dist/ is up to date
        run: git diff --exit-code -- dist || (echo "::error::dist/ is stale — run 'pnpm build' and commit" && exit 1)

      - run: pnpm build-storybook

      - uses: actions/upload-pages-artifact@v3
        with:
          path: storybook-static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
